name: Deploy Frontend (dev)

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Instalar o Quasar CLI Globalmente
        run: npm install -g @quasar/cli

      - name: Compilar o Projeto (Build)
        run: quasar build

      - name: Enviar Arquivos para o Servidor via Rsync/SSH
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: dist/spa/
          remote_path: ${{ secrets.DM_FRONT_DEPLOY_PATH }}
          remote_host: ${{ secrets.DM_FRONT_SSH_HOST }}
          remote_user: ${{ secrets.DM_FRONT_SSH_USER }}
          remote_key: ${{ secrets.DM_FRONT_SSH_KEY }}